name: Release

# Tag pushes dispatch publication from trusted main. Manual runs default to verify.
# This workflow only releases stable vX.Y.Z tags.
# Verify is the default. npm publish additionally requires the repository-bound
# release.yml trusted publisher with direct publish allowed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable v<major>.<minor>.<patch> tag reachable from main
        required: true
        type: string
      mode:
        description: Verify only, or publish the already verified tarball
        type: choice
        required: true
        default: verify
        options: [verify, publish]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch-tag:
    name: Start tagged release from trusted main
    if: github.repository == 'takboo/dsh-usage-state' && github.event_name == 'push' && github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Dispatch stable tags to the npm-authorized workflow on main
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Skipping non-stable release tag: $RELEASE_TAG"
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$RELEASE_TAG" -f mode=publish

  verify:
    name: Verify trusted release tag
    if: github.repository == 'takboo/dsh-usage-state' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - name: Read validation code from the dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate tag ancestry, version and released changelog before checkout
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release.mjs --tag "$RELEASE_TAG" --base origin/main --github-output
      - name: Checkout the verified immutable tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: npm ci
      - run: npm run verify:metadata
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run verify:artifacts
      - name: Generate and validate the release tarball exactly once
        run: npm run verify:package -- --out-dir "$RUNNER_TEMP/release-package"
      - name: Smoke the same prebuilt tarball on the canonical Node
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: npm run smoke:runtime -- --tarball "$RUNNER_TEMP/release-package/dsh-usage-state-$VERSION.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  runtime-node20:
    name: Verify release runtime Node 20
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: '20'
          cache: ''
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: ${{ runner.temp }}/release-package/
          digest-mismatch: error
      - name: Run only the same prebuilt JavaScript artifact
        run: npm run smoke:runtime -- --tarball "$RUNNER_TEMP/release-package/dsh-usage-state-$VERSION.tgz"

  publish:
    name: Publish verified tarball to npm
    needs: [verify, runtime-node20]
    if: inputs.mode == 'publish' && github.repository == 'takboo/dsh-usage-state' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # Publication validation uses trusted main code, not code from the archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: ''
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: ${{ runner.temp }}/release-package/
          digest-mismatch: error
      - run: npm run verify:metadata
      - name: Locate the verified tarball on the runner
        run: echo "TARBALL=$RUNNER_TEMP/release-package/dsh-usage-state-$VERSION.tgz" >> "$GITHUB_ENV"
      - name: Check immutable bytes, trusted stable tag and unused npm version
        run: |
          node scripts/verify-release.mjs --tag "$RELEASE_TAG" --base origin/main --artifact-report "$RUNNER_TEMP/release-package/verification.json" --require-unpublished
          node scripts/verify-package.mjs --tarball "$TARBALL" --expected-version "$VERSION" --expected-commit "$VERIFIED_COMMIT" --require-report
      - name: Publish the exact tarball via npm OIDC
        run: npm publish "$TARBALL" --tag latest --ignore-scripts

  github-release:
    name: Attach verified bytes to GitHub Release
    needs: [verify, publish]
    if: inputs.mode == 'publish' && github.repository == 'takboo/dsh-usage-state' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # This job can be rerun after npm succeeded; it never republishes npm.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: ''
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: ${{ runner.temp }}/release-package/
          digest-mismatch: error
      - name: Locate the verified tarball on the runner
        run: echo "TARBALL=$RUNNER_TEMP/release-package/dsh-usage-state-$VERSION.tgz" >> "$GITHUB_ENV"
      - name: Recheck artifact identity and bytes without requiring npm to be unused
        run: |
          node scripts/verify-release.mjs --tag "$RELEASE_TAG" --base origin/main --artifact-report "$RUNNER_TEMP/release-package/verification.json"
          node scripts/verify-package.mjs --tarball "$TARBALL" --expected-version "$VERSION" --expected-commit "$VERIFIED_COMMIT" --require-report
      - name: Check whether an earlier attempt created the GitHub Release
        id: release-state
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${encodeURIComponent(process.env.RELEASE_TAG)}`, {
            headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' },
            signal: AbortSignal.timeout(15000),
          })
          if (!response.ok && response.status !== 404) throw new Error(`GitHub release lookup HTTP ${response.status}`)
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.ok}\n`)
          JS
      - name: Create release metadata when absent
        if: steps.release-state.outputs.exists != 'true'
        run: |
          printf 'Published the verified npm tarball for %s.\n\nCommit: %s\nThe attached SHA-256 file identifies the exact verified artifact.\n' "$RELEASE_TAG" "$VERIFIED_COMMIT" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Attach the same tarball and checksum, including on recovery
        run: gh release upload "$RELEASE_TAG" "$TARBALL" "$TARBALL.sha256" --clobber

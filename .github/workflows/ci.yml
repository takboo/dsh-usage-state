name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow expressions with pinned actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  development-floor:
    name: Development Node 22.18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 22.18.0
      - run: npm ci
      - run: npm run verify:metadata
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  canonical:
    name: Canonical Node 24 package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: npm ci
      - run: npm run verify:metadata
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run verify:artifacts
      - name: Pack and verify once
        run: npm run verify:package -- --out-dir "$RUNNER_TEMP/verified-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-package
          path: ${{ runner.temp }}/verified-package/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  runtime-node20:
    name: Prebuilt runtime Node 20
    needs: canonical
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: '20'
          cache: ''
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-package
          path: ${{ runner.temp }}/verified-package/
          digest-mismatch: error
      - name: Run only prebuilt JavaScript with fake account data
        run: |
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json","utf8")).version')
          npm run smoke:runtime -- --tarball "$RUNNER_TEMP/verified-package/dsh-usage-state-$version.tgz"

name: Monitor DSH releases

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact npm version or published GitHub tag, e.g. 0.2.1-rc.4
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-release-monitor
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover official GitHub releases, npm latest/next and bot reports
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_TAG: ${{ inputs.tag }}
        run: node scripts/compatibility/discover.mjs

  check:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        if: matrix.mode == 'check'
        with:
          cache: ''
      - run: npm ci --ignore-scripts
        if: matrix.mode == 'check'
      - name: Check exact upstream contracts and baseline
        if: matrix.mode == 'check'
        env:
          DSH_TARGET: ${{ toJSON(matrix.target) }}
          DSH_REPORT_DIR: ${{ runner.temp }}/dsh-report-${{ matrix.version }}
        run: node scripts/compatibility/check.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.mode == 'check'
        with:
          name: dsh-check-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/dsh-report-${{ matrix.version }}/*.json
            ${{ runner.temp }}/dsh-report-${{ matrix.version }}/*.log
            ${{ runner.temp }}/dsh-report-${{ matrix.version }}/*failure.png
          retention-days: 14
          if-no-files-found: warn

  report:
    needs: [discover, check]
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.mode == 'check'
        continue-on-error: true
        with:
          name: dsh-check-${{ matrix.version }}
          path: ${{ runner.temp }}/dsh-report
          digest-mismatch: error
      - name: Create or update the durable report
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_ITEM: ${{ toJSON(matrix) }}
          REPORT_ARTIFACT_OK: ${{ steps.artifact.outcome }}
        run: node scripts/compatibility/report.mjs "$RUNNER_TEMP/dsh-report/report.json"
